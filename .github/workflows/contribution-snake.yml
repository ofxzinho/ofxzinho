name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '28 */6 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-snake
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ofxzinho
          outputs: contribution-grid.svg
      - name: Refresh grid without changing movement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/ofxzinho/ofxzinho/975b22074cdff25fad3913492d29c2d0fee1eac0/snake.svg' -o original.svg
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/refresh-snake.mjs?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw+json' > refresh-snake.mjs
          node refresh-snake.mjs original.svg contribution-grid.svg snake.svg
      - name: Publish updated SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="repos/$GITHUB_REPOSITORY/contents/snake.svg"
          sha=$(gh api "$path" --jq .sha)
          if [ "$sha" = "$(git hash-object snake.svg)" ]; then
            echo 'Contribution snake is already up to date.'
            exit 0
          fi
          gh api --method PUT "$path" -f message='Refresh contribution snake' -f sha="$sha" -f content="$(base64 -w0 snake.svg)" --jq .commit.sha
