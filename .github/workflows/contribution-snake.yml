name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '28 */6 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-snake
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ofxzinho
          outputs: contribution-grid.svg
      - name: Render growing snake
        run: node scripts/grow-snake.mjs contribution-grid.svg snake.svg
      - name: Publish updated SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="repos/$GITHUB_REPOSITORY/contents/snake.svg"
          sha=$(gh api "$path" --jq .sha)
          if [ "$sha" = "$(git hash-object snake.svg)" ]; then
            echo 'Contribution snake is already up to date.'
            exit 0
          fi
          jq -n --arg sha "$sha" --rawfile content <(base64 -w0 snake.svg)             '{message: "Refresh contribution snake", sha: $sha, content: $content}'             | gh api --method PUT "$path" --input - --jq .commit.sha
